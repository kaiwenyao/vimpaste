# VimPaste SPA 静态托管配置（配合 Dockerfile 的 nginx 阶段使用）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 压缩 JS/CSS/JSON/SVG 等文本资源
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的构建产物可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页、Service Worker 与 manifest 不缓存，否则浏览器旧缓存会挡住
    # PWA 的「发现新版本」提示条（registerType: prompt 依赖 sw.js 及时更新）
    location = /index.html          { add_header Cache-Control "no-cache"; }
    location = /sw.js               { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # v2：/api/ 同源反代到 Fastify 服务（同源方案的前提——CSP connect-src 'self'
    # 不放开、无 CORS、Cookie SameSite=Strict 可用）。API 响应永不缓存。
    location /api/ {
        proxy_pass http://vimpaste-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # 其余请求回退到 index.html（SPA 路由兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# VimPaste API（Fastify）。镜像由 Jenkins 构建并推送 ghcr，GitOps 阶段更新此行。
# 启动命令先执行 prisma migrate deploy（幂等，多副本由 Postgres 迁移锁保证）。
apiVersion: apps/v1
kind: Deployment

metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: vimpaste-api
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vimpaste-api

  template:
    metadata:
      labels:
        app: vimpaste-api

    spec:
      containers:
        - name: api
          # GitOps：Jenkins 按 commit 短 SHA 更新此行（首次部署前需确认镜像已存在）
          image: ghcr.io/kaiwenyao/vimpaste-api:5e8445a
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vimpaste-api-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: vimpaste-api-secrets
                  key: SESSION_SECRET
            # 注册已开放；需要收紧时改回 "true"，账号用 server 包的 create-user CLI 创建
            - name: DISABLE_REGISTRATION
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # server 镜像以 USER node（uid 1000）运行，这里保持一致。
          # runAsUser 必须显式给出：镜像 USER 是非数字用户名，kubelet 无法据此
          # 验证非 root，会报 cannot verify user is non-root 拒绝启动容器。
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

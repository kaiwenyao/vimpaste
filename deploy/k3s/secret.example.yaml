# 复制为 secret.yaml 后 kubectl apply（或用 sealed-secrets/外部凭据管理）。
# 数据库密码：openssl rand -hex 32（可安全地原样嵌入 DATABASE_URL）
# SESSION_SECRET：openssl rand -base64 32
# 注意：本文件是模板，真实 Secret 不入库。
apiVersion: v1
kind: Secret
metadata:
  name: vimpaste-api-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://vimpaste:CHANGE_ME@vimpaste-postgres:5432/vimpaste
  SESSION_SECRET: CHANGE_ME_AT_LEAST_32_BYTES_RANDOM
  POSTGRES_PASSWORD: CHANGE_ME

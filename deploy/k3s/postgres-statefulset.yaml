# 专用 Postgres 实例：生命周期与 VimPaste 绑定，不复用集群已有数据库
# （VimPaste 仓库 docs/plan-v2-accounts.md §1 决策表）。
# 数据可靠性风险（不做服务端备份）已确认接受——兜底是前端「导出 JSON」
# 按钮与浏览器内 500 条本地缓存。
# 密码来自 vimpaste-api-secrets 的 POSTGRES_PASSWORD（建法见本目录 README.md）。
apiVersion: apps/v1
kind: StatefulSet

metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  name: vimpaste-postgres
  namespace: dev

spec:
  serviceName: vimpaste-postgres
  replicas: 1

  selector:
    matchLabels:
      app: vimpaste-postgres

  template:
    metadata:
      labels:
        app: vimpaste-postgres

    spec:
      containers:
        - name: postgres
          # 版本与本地 docker-compose、Jenkins 测试 sidecar 保持一致（postgres:17-alpine），
          # 避免迁移在不同环境行为不同
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: vimpaste
            - name: POSTGRES_DB
              value: vimpaste
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vimpaste-api-secrets
                  key: POSTGRES_PASSWORD
            # 挂载点下的 pgdata 子目录避开 local-path 卷根部的 lost+found
            #（非空目录会让 initdb 拒绝启动）
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # pg_isready 本身毫秒级，但 exec 探针的 timeoutSeconds 默认 1s 把容器
          # runtime 开销也算在内，节点负载高时会误杀数据库；给一点余量。
          # 显式走 TCP：镜像初始化期间只监听 Unix socket 的临时实例不应被判为就绪
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vimpaste", "-d", "vimpaste"]
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vimpaste", "-d", "vimpaste"]
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 10
          # 必须是 Burstable 而非 BestEffort：节点内存吃紧时 kubelet 先驱逐
          # BestEffort，数据库不该排在最前面被杀
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # 不指定 storageClassName，用 k3s 默认的 local-path
        resources:
          requests:
            storage: 2Gi
